suite_name: feature-pilot-v1
purpose: development_feature_budget_pilot
seeds: [17]
max_fpr: 0.01
threads: 4
models:
  - model: rf
    features: {method: mutual_info, k: 8}
    hyperparameters: {n_estimators: 100, max_depth: 16, min_samples_leaf: 2, n_jobs: 4}
  - model: rf
    features: {method: mutual_info, k: 16}
    hyperparameters: {n_estimators: 100, max_depth: 16, min_samples_leaf: 2, n_jobs: 4}
  - model: rf
    features: {method: mutual_info, k: 24}
    hyperparameters: {n_estimators: 100, max_depth: 16, min_samples_leaf: 2, n_jobs: 4}
  - model: mlp
    features: {method: mutual_info, k: 8}
    hyperparameters: {hidden_sizes: [64, 32], epochs: 40, batch_size: 1024, patience: 6}
  - model: mlp
    features: {method: mutual_info, k: 16}
    hyperparameters: {hidden_sizes: [64, 32], epochs: 40, batch_size: 1024, patience: 6}
  - model: mlp
    features: {method: mutual_info, k: 24}
    hyperparameters: {hidden_sizes: [64, 32], epochs: 40, batch_size: 1024, patience: 6}
