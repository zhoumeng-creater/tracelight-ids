suite_name: smoke
purpose: engineering_smoke_not_research_result
seeds: [17]
max_fpr: 0.01
threads: 2
models:
  - model: lr
    features: {method: all}
    hyperparameters: {max_iter: 300}
  - model: rf
    features: {method: all}
    hyperparameters: {n_estimators: 20, max_depth: 8, n_jobs: 2}
  - model: hgb
    features: {method: all}
    hyperparameters: {max_iter: 20, max_leaf_nodes: 15}
  - model: mlp
    features: {method: all}
    hyperparameters: {hidden_sizes: [64, 32], epochs: 3, batch_size: 256, patience: 3}
