suite_name: distillation-smoke
purpose: synthetic_engineering_validation_only_not_research_evidence
seeds: [17]
max_fpr: 0.05
threads: 2
benchmark_rounds: 1
models:
  - model: hgb
    variant: hgb_reference
    features: {method: all}
    hyperparameters: &teacher_hp {max_iter: 5, max_leaf_nodes: 7, min_samples_leaf: 5, early_stopping: false}
  - model: mlp
    variant: mlp_reference
    features: {method: all}
    hyperparameters: {hidden_sizes: [64, 32], epochs: 3, patience: 2, batch_size: 128, learning_rate: 0.001, weight_decay: 0.0001, min_delta: 0.00001}
  - model: mlp
    variant: student_hard
    features: {method: all}
    hyperparameters: &student_hp {hidden_sizes: [32, 16], epochs: 3, patience: 2, batch_size: 128, learning_rate: 0.001, weight_decay: 0.0001, min_delta: 0.00001}
  - model: mlp
    variant: student_kd
    features: {method: all}
    hyperparameters: *student_hp
    distillation:
      alpha: 0.5
      temperature: 1.0
      folds: 3
      fold_seed: 20261101
      teacher:
        model: hgb
        features: {method: all}
        hyperparameters: *teacher_hp
