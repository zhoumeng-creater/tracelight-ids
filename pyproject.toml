[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelight-ids"
version = "0.1.0"
description = "Reproducible lightweight intrusion detection experiments with traceable evidence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy==1.26.4", "pandas==2.2.2", "scipy==1.14.0",
  "scikit-learn==1.5.1", "pyarrow==21.0.0", "PyYAML==6.0.2",
  "joblib==1.4.2", "threadpoolctl==3.5.0", "psutil==6.0.0"
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.10"]
# Install the CPU or CUDA wheel explicitly; see docs/LAB.md.
torch = ["torch==2.6.0"]

[project.scripts]
tracelight = "ids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
